name: Build Desktop Apps (Win + Mac + Linux)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: electron:build:win
          - os: macos-latest
            script: electron:build:mac
          - os: ubuntu-latest
            script: electron:build:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Vite + Electron
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Vite ENV-Vars vom Repository-Secrets durchreichen
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_GROQ_MODEL: ${{ secrets.VITE_GROQ_MODEL }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: valdermoor-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

      # electron-builder mit --publish always erstellt automatisch Release +
      # uploadet alle Files inkl. latest.yml/latest-mac.yml/latest-linux.yml.
      # Diese werden von electron-updater zur Update-Erkennung verwendet.
      # Race-condition zwischen den 3 OS-Jobs ist okay — electron-builder
      # appended zum existierenden Release statt neuem.

      # Post-Build: prerelease-Flag setzen basierend auf Tag-Pattern
      - name: Set prerelease flag based on tag
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ ^v0\. ]] || [[ "$TAG" =~ -(beta|rc|alpha) ]]; then
            echo "Marking $TAG as Pre-Release (Beta)"
            gh release edit "$TAG" --prerelease --draft=false --title "Valdermoor $TAG (Beta)" || true
          else
            echo "Marking $TAG as Stable + Latest"
            gh release edit "$TAG" --prerelease=false --draft=false --latest --title "Valdermoor $TAG (Stable)" || true
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
