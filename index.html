<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Valdermoor — Dein D&D Abenteuer</title>
  </head>
  <body>
    <main id="app">
      <aside id="character-panel">
        <h2>Charakter</h2>
        <div class="field">
          <label>Name</label>
          <div id="char-name" class="value">???</div>
        </div>
        <div class="field">
          <label>Klasse</label>
          <div id="char-class" class="value">???</div>
        </div>
        <div class="field">
          <label>Lebenspunkte</label>
          <div class="hp-row">
            <span id="char-hp">20</span> / <span id="char-max-hp">20</span>
          </div>
          <div class="hp-bar-outer">
            <div id="char-hp-bar" class="hp-bar-inner"></div>
          </div>
        </div>
        <h3>Werte</h3>
        <div class="stats-grid">
          <div class="stat"><label>STR</label><span id="stat-STR">10</span></div>
          <div class="stat"><label>DEX</label><span id="stat-DEX">10</span></div>
          <div class="stat"><label>CON</label><span id="stat-CON">10</span></div>
          <div class="stat"><label>INT</label><span id="stat-INT">10</span></div>
          <div class="stat"><label>WIS</label><span id="stat-WIS">10</span></div>
          <div class="stat"><label>CHA</label><span id="stat-CHA">10</span></div>
        </div>
      </aside>

      <section id="chat-panel">
        <header id="chat-header">
          <h1>Valdermoor</h1>
          <div id="status" class="status-ok">Bereit</div>
        </header>
        <div id="messages" role="log" aria-live="polite"></div>
        <form id="input-form">
          <textarea
            id="input"
            rows="2"
            placeholder="Was tust du? (Enter zum Senden, Shift+Enter für neue Zeile)"
            autocomplete="off"
          ></textarea>
          <button type="submit" id="send-btn">Senden</button>
        </form>
      </section>

      <aside id="side-panel">
        <h2>Würfel</h2>
        <div id="dice-grid">
          <button type="button" class="dice-btn" data-sides="4">W4</button>
          <button type="button" class="dice-btn" data-sides="6">W6</button>
          <button type="button" class="dice-btn" data-sides="8">W8</button>
          <button type="button" class="dice-btn" data-sides="10">W10</button>
          <button type="button" class="dice-btn" data-sides="12">W12</button>
          <button type="button" class="dice-btn" data-sides="20">W20</button>
        </div>
        <div id="dice-result" aria-live="polite"></div>

        <h2>Inventar</h2>
        <ul id="inventory-list">
          <li class="empty">Noch nichts dabei…</li>
        </ul>
      </aside>
    </main>

    <div id="char-modal" class="modal-overlay">
      <div class="modal-box">
        <h2>Dein Charakter</h2>
        <p class="modal-sub">
          Fülle das Formular aus — oder lade einen PDF-Charakterbogen hoch, dann versuchen wir die Felder automatisch zu erkennen.
        </p>

        <div class="modal-upload">
          <label class="upload-btn" for="pdf-input">📄 PDF-Charakterbogen laden</label>
          <input type="file" id="pdf-input" accept="application/pdf,.pdf" hidden />
          <span id="pdf-status" class="pdf-status"></span>
        </div>

        <div class="modal-grid">
          <div class="modal-field">
            <label for="form-name">Name</label>
            <input type="text" id="form-name" placeholder="z.B. Thorin Eichenschild" />
          </div>
          <div class="modal-field">
            <label for="form-class">Klasse</label>
            <select id="form-class">
              <option>Krieger</option>
              <option>Magier</option>
              <option>Zauberer</option>
              <option>Dieb</option>
              <option>Schurke</option>
              <option>Waldläufer</option>
              <option>Kleriker</option>
              <option>Barde</option>
              <option>Paladin</option>
              <option>Druide</option>
              <option>Mönch</option>
              <option>Hexenmeister</option>
            </select>
          </div>
          <div class="modal-field">
            <label for="form-hp">Max. Lebenspunkte</label>
            <input type="number" id="form-hp" min="1" max="999" value="20" />
          </div>
        </div>

        <div class="modal-stats-header">
          <h3>Werte</h3>
          <button type="button" id="roll-stats-btn" class="btn-secondary">
            🎲 Neu würfeln (4W6 drop lowest)
          </button>
        </div>
        <div class="modal-stats">
          <div class="form-stat">
            <label>STR</label><input type="number" id="form-STR" min="3" max="20" value="10" />
          </div>
          <div class="form-stat">
            <label>DEX</label><input type="number" id="form-DEX" min="3" max="20" value="10" />
          </div>
          <div class="form-stat">
            <label>CON</label><input type="number" id="form-CON" min="3" max="20" value="10" />
          </div>
          <div class="form-stat">
            <label>INT</label><input type="number" id="form-INT" min="3" max="20" value="10" />
          </div>
          <div class="form-stat">
            <label>WIS</label><input type="number" id="form-WIS" min="3" max="20" value="10" />
          </div>
          <div class="form-stat">
            <label>CHA</label><input type="number" id="form-CHA" min="3" max="20" value="10" />
          </div>
        </div>

        <details id="pdf-text-wrapper" class="modal-pdf-preview" hidden>
          <summary>Extrahierter PDF-Text anzeigen</summary>
          <pre id="pdf-text"></pre>
        </details>

        <div class="modal-actions">
          <button type="button" id="start-btn" class="btn-primary">
            ⚔️ Abenteuer beginnen
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
